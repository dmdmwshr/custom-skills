[project]
name = "xf-product-case-registry"
version = "1.6.1"
description = "消防产品案卷浏览器采集、本地整理、PDF 清点与 V2 接口导入工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "tzdata>=2025.2,<2027",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
