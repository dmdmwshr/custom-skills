interface:
  display_name: "消防产品案卷登记"
  short_description: "采集消防产品相关、2026 起案卷：先不合格，可见页面读取，本地整理核验归档，飞书结构化检索"
  default_prompt: "使用 $xf-product-case-registry，先查来源年度覆盖、总账和原断点。只采消防产品相关、2026 起案卷，先不合格后其他；来源只读可见页面，列表线索经详情的项目号/RWID/单位/大队四项闭合后才确认，不读页面内部状态。沿用已授权的 LocalVault 自动登录，不重复要求手工登录。复用未变材料与原任务，本地整理后用 local-verify 核验并归档；案卷原件不上传服务器、飞牛或飞书；飞书承载结构化元数据、属性与快速检索。报告变化、待办和真实覆盖缺口，不用本地数量代替来源年度总数。"
