interface:
  display_name: "消防产品案卷登记"
  short_description: "先对齐来源年度全量索引，再优先迁移不合格案卷"
  default_prompt: "使用 $xf-product-case-registry，先查来源年度覆盖、总账和原断点。先按监督系统本年完整任务清单逐项对齐项目编号；不合格案卷是同一总账的子集，通过文书有效结果确认后优先迁移。年度基线完成后日常只扫描近三个自然月创建的全部相关文书。沿用已授权的 LocalVault 自动登录，不重复要求手工登录。复用未变材料与原任务，逐份正文续核；报告变化、待办和真实覆盖缺口，不用本地数量代替来源年度总数。"
